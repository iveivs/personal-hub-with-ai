<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Personal Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sidebar nav + single working column; on phones nav becomes a scrolling strip.
   Palette and type come from the original GTD app. */
:root {
  --bg: #f6f5f2;
  --surface: #ffffff;
  --surface-2: #efede8;
  --text: #1d1c1a;
  --muted: #6b6862;
  --border: #e2dfd8;
  --accent: #2f63d6;
  --accent-ink: #ffffff;
  --accent-soft: #e5ecfb;
  --nap: #8fadec;
  --ok: #2b8a57;
  --ok-soft: #e1f2e8;
  --warn: #b7720a;
  --warn-soft: #fbefd9;
  --danger: #c43c3c;
  --danger-soft: #fae3e3;
  --overlay: rgba(0,0,0,.4);
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.06);
  --radius: 12px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --surface: #1f1f1d; --surface-2: #2a2927; --text: #ecebe8; --muted: #9c9992;
    --border: #353431; --accent: #6d97f2; --accent-ink: #0f1420; --accent-soft: #24304a; --nap: #3f5c9c;
    --ok: #5cc58b; --ok-soft: #1d3327; --warn: #e3a648; --warn-soft: #3a2e17; --danger: #ec7373; --danger-soft: #3d2222;
    --overlay: rgba(0,0,0,.6);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161615; --surface: #1f1f1d; --surface-2: #2a2927; --text: #ecebe8; --muted: #9c9992;
  --border: #353431; --accent: #6d97f2; --accent-ink: #0f1420; --accent-soft: #24304a; --nap: #3f5c9c;
  --ok: #5cc58b; --ok-soft: #1d3327; --warn: #e3a648; --warn-soft: #3a2e17; --danger: #ec7373; --danger-soft: #3d2222;
  --overlay: rgba(0,0,0,.6);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.45 var(--font);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Layout */
.app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
.side { border-right: 1px solid var(--border); padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; padding: 0 10px 16px; }
.brand small { font-weight: 400; color: var(--muted); font-size: 12px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-sep { height: 1px; background: var(--border); margin: 8px 10px; }
.nav button {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  background: none; border: 0; border-radius: 8px; padding: 8px 10px; color: var(--text);
}
.nav button:hover { background: var(--surface-2); }
.nav button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav .ico { width: 20px; text-align: center; }
.nav .count { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav .count.alert { background: var(--warn); color: var(--accent-ink); border-radius: 10px; padding: 0 7px; font-weight: 600; }

.main { min-width: 0; padding-block: 20px 80px; padding-left: 32px; padding-right: max(32px, env(safe-area-inset-right, 0px)); max-width: 900px; }
.capture { display: flex; gap: 8px; position: sticky; top: env(safe-area-inset-top, 0px); padding: 12px 0; background: var(--bg); z-index: 5; }
.capture input {
  flex: 1; min-width: 0; padding: 12px 14px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow); outline: none;
}
.capture input:focus { border-color: var(--accent); }
.capture-hint { font-size: 12px; color: var(--muted); margin: -4px 2px 12px; }

h1 { font-size: 24px; margin: 12px 0 4px; display: flex; align-items: center; gap: 10px; text-wrap: balance; }
.sub { color: var(--muted); margin: 0 0 16px; }
.hint {
  background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent);
  border-radius: 8px; padding: 10px 14px; margin: 0 0 16px; font-size: 14px; color: var(--muted);
}
.hint b { color: var(--text); }
.hint-close { float: right; background: none; border: 0; color: var(--muted); padding: 0 0 0 8px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 8px 14px;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--danger); }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.sm { padding: 4px 10px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Items */
.list { list-style: none; margin: 0 0 20px; padding: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--border); }
.item:first-child { border-top: 0; }
.item:hover { background: var(--surface-2); }
.check {
  flex: none; width: 20px; height: 20px; margin-top: 1px; border-radius: 50%;
  border: 2px solid var(--muted); background: none; padding: 0; position: relative;
}
.check:hover { border-color: var(--ok); }
.is-done .check, .check.on { background: var(--ok); border-color: var(--ok); }
.is-done .check::after, .check.on::after { content: ""; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px; border: solid var(--surface); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.is-done .item-title { text-decoration: line-through; color: var(--muted); }
.item-main { flex: 1; min-width: 0; cursor: pointer; }
.item-title { overflow-wrap: anywhere; }
.item-notes { font-size: 13px; color: var(--muted); margin-top: 2px; white-space: pre-wrap; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.chip { font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--surface-2); color: var(--muted); }
.chip.ctx { background: var(--accent-soft); color: var(--accent); }
.chip.due-over { background: var(--danger-soft); color: var(--danger); font-weight: 600; }
.chip.due-today { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.chip.focus { background: var(--warn-soft); color: var(--warn); }
.chip.urgent { background: var(--danger); color: var(--surface); font-weight: 700; }
/* Urgent strip: shown on every screen until the item is done */
.urgent-bar { display: grid; gap: 6px; margin: 0 0 14px; }
.urgent-row { display: flex; align-items: center; gap: 10px; background: var(--danger-soft); border: 1px solid var(--danger); border-left-width: 4px; border-radius: 10px; padding: 9px 12px; color: var(--text); }
.urgent-row .ut { flex: 1; min-width: 0; cursor: pointer; overflow-wrap: anywhere; }
.urgent-row .ut b { color: var(--danger); }
.urgent-row .ud { font-size: 13px; color: var(--danger); font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.urgent-row .check { border-color: var(--danger); }
.urgent-row.pulse { animation: urgentPulse 2.4s ease-in-out infinite; }
@keyframes urgentPulse { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 0 4px var(--danger-soft); } }
@media (prefers-reduced-motion: reduce) { .urgent-row.pulse { animation: none; } }
.item-side { flex: none; display: flex; gap: 4px; align-items: center; }
.star { background: none; border: 0; color: var(--muted); font-size: 17px; line-height: 1; padding: 2px 4px; border-radius: 6px; }
.star:hover { background: var(--surface-2); color: var(--warn); }
.star.on { color: var(--warn); }
.empty { text-align: center; color: var(--muted); padding: 32px 16px; background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); margin-bottom: 20px; }
.empty .big { font-size: 32px; display: block; margin-bottom: 6px; }
.group-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 18px 2px 8px; display: flex; gap: 8px; align-items: center; }
.group-title .n { font-weight: 400; }

/* Filters */
.filters { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.frow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.flabel { font-size: 13px; color: var(--muted); min-width: 92px; }
.pill { border: 1px solid var(--border); background: var(--surface); border-radius: 16px; padding: 3px 12px; font-size: 13px; }
.pill:hover { background: var(--surface-2); }
.pill.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.cta { display: flex; align-items: center; gap: 14px; background: var(--accent-soft); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; flex-wrap: wrap; }
.cta p { margin: 0; flex: 1; min-width: 200px; }

/* Projects */
.proj { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
.proj.stuck { border-color: var(--warn); }
.proj-head { display: flex; gap: 10px; align-items: flex-start; }
.proj-title { font-weight: 600; flex: 1; cursor: pointer; }
.proj-outcome { font-size: 13px; color: var(--muted); margin-top: 2px; }
.proj-warn { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 6px 10px; font-size: 13px; margin-top: 10px; }
.proj .list { margin: 10px 0 0; }
.inline-add { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.inline-add input { flex: 1; min-width: 160px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); }
.inline-add select { padding: 7px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); }

/* Review */
.rstep { display: flex; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; }
.rstep.done { opacity: .6; }
.rstep.done .rtitle { text-decoration: line-through; }
.rbody { flex: 1; min-width: 0; }
.rtitle { font-weight: 600; }
.rtext { font-size: 14px; color: var(--muted); margin: 2px 0 6px; }
.rphase { font-size: 12px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .05em; margin: 18px 0 8px; }

/* Help */
.flow { display: grid; gap: 8px; margin: 12px 0 20px; }
.flow .node { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
.flow .node b { display: block; }
.flow .node span { color: var(--muted); font-size: 14px; }
.prose { max-width: 640px; }
.kbd { font: 12px ui-monospace, Menlo, monospace; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--surface); }

/* Tiles, panels, charts */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; min-width: 0; }
.tile .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.tile .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
.tile .v small { font-size: 14px; font-weight: 400; color: var(--muted); }
.tile .d { font-size: 13px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
.energy { display: flex; gap: 4px; margin-top: 6px; }
.energy button { flex: 1; border: 1px solid var(--border); background: var(--bg); border-radius: 8px; padding: 6px 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.energy button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; }
.panel h3 { margin: 0 0 10px; font-size: 15px; }
.chart { width: 100%; overflow-x: auto; }
.chart svg { display: block; width: 100%; min-width: 360px; height: auto; }
.chart text { fill: var(--muted); font: 11px var(--font); font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0 12px; }
.num { font-variant-numeric: tabular-nums; }
.daynav { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.daynav b { min-width: 120px; text-align: center; }
.well { width: 100%; min-height: 64px; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); resize: vertical; }
.status-line { font-size: 12px; color: var(--muted); }

/* Modal */
.modal { position: fixed; inset: 0; background: var(--overlay); display: grid; place-items: center; padding: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); z-index: 50; }
.sheet { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); width: 100%; max-width: 560px; max-height: calc(100vh - 32px); overflow-y: auto; padding: 22px; }
.sheet h2 { margin: 0 0 4px; font-size: 20px; }
.sheet-top { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; color: var(--muted); font-size: 13px; }
.sheet-top .x { margin-left: auto; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; min-width: 0; }
.field label { font-size: 13px; color: var(--muted); }
.field input, .field select, .field textarea {
  padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); width: 100%; min-width: 0;
}
.field textarea { min-height: 70px; resize: vertical; overflow-y: auto; }
.field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.checkline { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; font-size: 14px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.sheet-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.sheet-actions .spacer { flex: 1; }

/* Process wizard */
.pitem { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; font-size: 17px; font-weight: 600; margin-bottom: 6px; overflow-wrap: anywhere; }
.pitem-edit { width: 100%; background: var(--surface-2); border: 1px solid transparent; border-radius: 10px; padding: 12px 14px; font-size: 17px; font-weight: 600; margin-bottom: 6px; }
.pitem-edit:focus { outline: none; border-color: var(--accent); }
.trail { display: flex; flex-wrap: wrap; gap: 4px; font-size: 12px; color: var(--muted); margin-bottom: 14px; min-height: 18px; }
.trail span::after { content: " →"; }
.trail span:last-child::after { content: ""; }
.q { font-size: 19px; font-weight: 700; margin: 6px 0 4px; }
.qhint { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
.choices { display: grid; gap: 8px; }
.choice { text-align: left; border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; }
.choice:hover { border-color: var(--accent); background: var(--accent-soft); }
.choice .ci { font-size: 22px; width: 28px; text-align: center; }
.choice b { display: block; }
.choice span { font-size: 13px; color: var(--muted); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.progress { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; margin-bottom: 14px; }
.progress div { height: 100%; background: var(--accent); transition: width .2s; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow); display: flex; gap: 14px; align-items: center; z-index: 60; max-width: calc(100vw - 32px); }
.toast button { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 0; filter: brightness(1.4); }

.loading { color: var(--muted); padding: 40px 0; text-align: center; }
.welcome ol { padding-left: 20px; }
.welcome li { margin-bottom: 6px; }

@media (prefers-reduced-motion: reduce) { .progress div { transition: none; } }

@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 11; background: var(--bg); }
  .side { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; border-right: 0; border-bottom: 1px solid var(--border); padding-block: 8px 6px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); background: var(--bg); z-index: 10; }
  .brand { display: none; }
  .nav { flex-direction: row; overflow-x: auto; gap: 4px; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav-sep { display: none; }
  .nav button { width: auto; white-space: nowrap; padding: 6px 10px; flex: none; }
  .nav .count { margin-left: 4px; }
  .main { padding-block: 0 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .capture { top: calc(52px + env(safe-area-inset-top, 0px)); }
  .grid2 { grid-template-columns: 1fr; }
  .desk-only { display: none; }
  .flabel { min-width: 0; width: 100%; }
  h1 { font-size: 21px; }
}
</style>

<div class="app">
  <aside class="side">
    <div class="brand">🧠 Personal Hub <small>личная система</small></div>
    <nav class="nav" id="nav" aria-label="Разделы"></nav>
  </aside>
  <main class="main">
    <form class="capture" id="captureForm" autocomplete="off">
      <input id="capture" placeholder="Что у тебя в голове? Запиши и нажми Enter…" aria-label="Быстрый ввод во Входящие">
      <button class="btn primary" type="submit">Во Входящие</button>
    </form>
    <div class="capture-hint">Не думай, куда положить, просто запиши. Разберёшь потом.<span class="desk-only"> Клавиша <span class="kbd">N</span> ставит курсор сюда.</span></div>
    <div id="urgentBar" class="urgent-bar" hidden></div>
    <div id="view"><div class="loading">Загружаю данные…</div></div>
  </main>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
'use strict';
const UI_KEY = 'hub.ui.v1';
const DEFAULT_CONTEXTS = ['@компьютер', '@телефон', '@дом', '@вне дома', '@везде'];
const TIMES = [['5', '5 мин'], ['15', '15 мин'], ['30', '30 мин'], ['60', '1 час+']];
const ENERGY = [['low', 'Мало сил'], ['mid', 'Средне'], ['high', 'Нужна голова']];
const STATUS = { inbox: 'Входящие', next: 'Следующее действие', waiting: 'Ожидание', calendar: 'Календарь (на дату)', someday: 'Когда-нибудь', reference: 'Справка', done: 'Готово' };
const SLEEP_TYPES = [['night', 'Ночной'], ['nap', 'Досып после садика'], ['day', 'Днём']];
const MEALS = [['breakfast', 'Завтрак'], ['lunch', 'Обед'], ['dinner', 'Ужин'], ['snack', 'Перекус']];
const SOURCES = [['photo', 'Оценка по фото'], ['text', 'Оценка по описанию'], ['manual', 'Вручную']];

const VIEWS = [
  { id: 'today', ico: '☀️', title: 'Сегодня' },
  { sep: true },
  { id: 'inbox', ico: '📥', title: 'Входящие' },
  { id: 'next', ico: '▶️', title: 'Следующие действия' },
  { id: 'calendar', ico: '📅', title: 'Календарь' },
  { id: 'waiting', ico: '⏳', title: 'Ожидание' },

/* ---------- state ---------- */
let S = { items: [], projects: [], sleep: [], meals: [], days: {}, contexts: DEFAULT_CONTEXTS.slice(), review: { checks: {}, lastDone: null } };

let DB = null;
let DB_STATE = 'loading'; // loading | ready | off
let META_EXISTS = false;
const LOADED = {};
const NEEDED = ['items', 'projects', 'sleep', 'meals', 'days', 'meta'];
const SYNC = { items: {}, projects: {}, sleep: {}, meals: {}, days: {}, meta: null };
const KINDS = ['items', 'projects', 'sleep', 'meals'];

function loadUI() {
  const def = { view: 'today', ctx: 'all', time: 'any', energy: 'any', hidden: {} };
  try { return Object.assign(def, JSON.parse(localStorage.getItem(UI_KEY) || '{}')); } catch (e) { return def; }
}

/* ---------- storage: db sync ---------- */
function stable(v) {
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).filter((k) => v[k] !== undefined).sort().map((k) => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}
function bodyOf(o) { const b = Object.assign({}, o); delete b.id; return b; }
const QUEUE = {};
function enqueue(path, op) {
  const prev = QUEUE[path] || Promise.resolve();
  const p = prev.then(op).catch((err) => { console.error(err); dbError(err); });
  QUEUE[path] = p;
  return p;
}
function dbError(e) {
  const c = e && e.code;
  if (c === 'quota_exceeded') toast('Место в базе закончилось. Удали старые записи в «Сделано».');
  else if (c === 'invalid_argument') toast('Не сохранилось: у этого просмотра нет прав на запись.');
  else if (c === 'revoked') toast('Доступ к базе закрыт. Обнови страницу.');
  else toast('Не сохранилось. Проверь интернет и повтори.');
}
function save() {
  if (!DB) { toast('База недоступна: изменения не сохранятся'); return; }
  KINDS.forEach((k) => {
    const seen = new Set();
    S[k].forEach((o) => {
      seen.add(o.id);
      const j = stable(bodyOf(o));
      if (SYNC[k][o.id] !== j) {
        SYNC[k][o.id] = j;
        const path = k + '/' + o.id, data = JSON.parse(j);
        enqueue(path, () => DB.doc(path).set(data));
      }
    });
    Object.keys(SYNC[k]).forEach((id) => {
      if (!seen.has(id)) { delete SYNC[k][id]; const path = k + '/' + id; enqueue(path, () => DB.doc(path).delete()); }
    });
  });
  Object.keys(S.days).forEach((d) => {
    const j = stable(S.days[d]);
    if (SYNC.days[d] !== j) { SYNC.days[d] = j; const path = 'days/' + d, data = JSON.parse(j); enqueue(path, () => DB.doc(path).set(data)); }
  });
  const mj = stable({ contexts: S.contexts, review: S.review, started: true });
  if (SYNC.meta !== mj) { SYNC.meta = mj; META_EXISTS = true; const data = JSON.parse(mj); enqueue('meta/state', () => DB.doc('meta/state').set(data)); }
}
function clone(o) { return JSON.parse(JSON.stringify(o || {})); }
function subCollection(k) {
  DB.collection(k).onSnapshot((snap) => {
    const arr = [], map = {};
    snap.docs.forEach((d) => { const o = clone(d.data()); o.id = d.id; arr.push(o); map[d.id] = stable(bodyOf(o)); });
    S[k] = arr; SYNC[k] = map; LOADED[k] = true; scheduleRender();
  }, (err) => { console.error(err); LOADED[k] = true; toast('Связь с базой оборвалась. Обнови страницу.'); scheduleRender(); });
}
function connect() {
  const use = window.claude && window.claude.use ? window.claude.use('db') : Promise.resolve(null);
  Promise.resolve(use).then((db) => {
    if (!db) { DB_STATE = 'off'; render(); return; }
    DB = db; DB_STATE = 'ready';
    KINDS.forEach(subCollection);
    DB.collection('days').onSnapshot((snap) => {
      const days = {}, map = {};
      snap.docs.forEach((d) => { days[d.id] = clone(d.data()); map[d.id] = stable(days[d.id]); });
      S.days = days; SYNC.days = map; LOADED.days = true; scheduleRender();
    }, () => { LOADED.days = true; scheduleRender(); });
    DB.doc('meta/state').onSnapshot((d) => {
      if (d.exists) {
        const m = clone(d.data());
        S.contexts = Array.isArray(m.contexts) && m.contexts.length ? m.contexts : DEFAULT_CONTEXTS.slice();
        S.review = m.review || { checks: {}, lastDone: null };
        S.review.checks = S.review.checks || {};
        META_EXISTS = true;
        SYNC.meta = stable({ contexts: S.contexts, review: S.review, started: true });
      }
      LOADED.meta = true; scheduleRender();
    }, () => { LOADED.meta = true; scheduleRender(); });
  }).catch(() => { DB_STATE = 'off'; render(); });
}
const isReady = () => DB_STATE === 'ready' && NEEDED.every((k) => LOADED[k]);
let renderQueued = false, renderDeferred = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  setTimeout(() => {
    renderQueued = false;
    const a = document.activeElement;
    if (a && $('#view').contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) { renderDeferred = true; renderNav(); return; }
    render();
  }, 30);
}
document.addEventListener('focusout', () => { if (renderDeferred) setTimeout(() => { const a = document.activeElement; if (a && $('#view').contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return; renderDeferred = false; render(); }, 0); });

/* ---------- helpers ---------- */
const $ = (s) => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
function dateStr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function today() { return dateStr(new Date()); }
function addDays(n, from) { const d = from ? parseDate(from) : new Date(); d.setDate(d.getDate() + n); return dateStr(d); }
function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function fmtDate(s) {
  if (!s) return '';
  if (s === today()) return 'сегодня';
  if (s === addDays(1)) return 'завтра';
  if (s === addDays(-1)) return 'вчера';
  const dt = parseDate(s);
  const opts = { day: 'numeric', month: 'short' };
  if (dt.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
  return dt.toLocaleDateString('ru-RU', opts);
}
function fmtLong(s) { return parseDate(s).toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' }); }
function daysAgo(ts) { return Math.floor((Date.now() - ts) / 86400000); }
function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}

const labelOf = (arr, v) => (arr.find((t) => t[0] === v) || [, v])[1];
const num = (v) => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : null; };

function newItem(title, extra) {

function projectMoving(p) { return S.items.some((i) => i.projectId === p.id && ['next', 'waiting', 'calendar'].includes(i.status)); }
function stuckProjects() { return S.projects.filter((p) => p.status === 'active' && !projectMoving(p)); }

/* sleep & food math */
function sleepHours(s) { const a = new Date(s.start), b = new Date(s.end); const h = (b - a) / 3600000; return isFinite(h) && h > 0 ? h : 0; }
function sleepOf(day) { return S.sleep.filter((s) => s.day === day).sort((a, b) => String(a.start).localeCompare(String(b.start))); }
function sleepTotal(day) { return sleepOf(day).reduce((t, s) => t + sleepHours(s), 0); }
function hm(iso) { return iso ? String(iso).slice(11, 16) : ''; }
function fmtHours(h) { const m = Math.round(h * 60); return Math.floor(m / 60) + ' ч ' + pad(m % 60) + ' мин'; }
function mealsOf(day) { return S.meals.filter((m) => m.date === day).sort((a, b) => String(a.time || '').localeCompare(String(b.time || ''))); }
function foodTotals(day) {
  return mealsOf(day).reduce((t, m) => { t.kcal += m.kcal || 0; t.p += m.protein || 0; t.f += m.fat || 0; t.c += m.carbs || 0; t.n++; return t; }, { kcal: 0, p: 0, f: 0, c: 0, n: 0 });
}
function lastDays(n) { const out = []; for (let k = n - 1; k >= 0; k--) out.push(addDays(-k)); return out; }
function setDay(day, patch) { S.days[day] = Object.assign({}, S.days[day] || {}, patch); save(); }

/* ---------- chart ---------- */
function niceStep(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function barChart(labels, series, unitFmt) {
  const W = 640, H = 200, L = 36, R = 8, T = 10, B = 24;
  const n = labels.length;
  const totals = labels.map((_, k) => series.reduce((t, s) => t + (s.values[k] || 0), 0));
  const maxV = Math.max(0, ...totals);
  const step = niceStep((maxV || 1) / 4);
  const top = Math.max(step, Math.ceil(maxV / step) * step);
  const y = (v) => T + (H - T - B) * (1 - v / top);
  const slot = (W - L - R) / n, bw = Math.min(28, slot * 0.62);
  let g = '';
  for (let v = 0; v <= top + 1e-9; v += step) {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)" stroke-width="1"/>`;
    g += `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${esc(unitFmt(v))}</text>`;
  }
  labels.forEach((lab, k) => {
    const x = L + slot * k + (slot - bw) / 2;
    let acc = 0;
    series.forEach((s) => {
      const v = s.values[k] || 0;
      if (v > 0) { g += `<rect x="${x}" y="${y(acc + v)}" width="${bw}" height="${Math.max(0, y(acc) - y(acc + v))}" rx="3" fill="${s.color}"><title>${esc(lab.title)}: ${esc(s.name)} ${esc(unitFmt(v))}</title></rect>`; acc += v; }
    });
    g += `<text x="${x + bw / 2}" y="${H - 7}" text-anchor="middle"${lab.today ? ' style="fill:var(--text);font-weight:700"' : ''}>${esc(lab.short)}</text>`;
  });
  const legend = series.length > 1 ? `<div class="legend">${series.map((s) => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>` : '';
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="График">${g}</svg></div>${legend}`;
}
function dayLabels(days) { const t = today(); return days.map((d) => ({ short: String(parseDate(d).getDate()), title: fmtDate(d), today: d === t })); }

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, undo) {
  const t = $('#toast');

}

function itemRow(it, opts = {}) {

    </div>${side}</li>`;
}

/* ---------- views ---------- */
const VIEW_RENDER = {
  today() {

    const day = S.days[t] || {};
    let h = `<h1>☀️ Сегодня</h1><p class="sub" style="text-transform:none">${esc(fmtLong(t))}</p>${hint('today')}`;
    const sl = sleepOf(t), st = sleepTotal(t);
    const ft = foodTotals(t);
    h += `<div class="tiles">
      <div class="tile"><div class="k">Сон за сутки</div>
        <div class="v">${sl.length ? fmtHours(st).replace(' мин', '<small> мин</small>').replace(' ч ', '<small> ч </small>') : '—'}</div>

        <div class="d">1 — нет сил, 5 — отлично</div></div>

        <div class="v">${ft.n ? fmt0(ft.kcal) + '<small> ккал</small>' : '—'}</div>
        <div class="d">${ft.n ? `Б ${fmt0(ft.p)} · Ж ${fmt0(ft.f)} · У ${fmt0(ft.c)} г · ${ft.n} ${plural(ft.n, 'приём', 'приёма', 'приёмов')}` : 'ничего не внесено'}</div></div>
    </div>`;
    h += `<div class="field"><label for="dayWell">Самочувствие</label><textarea id="dayWell" class="well" placeholder="Как ты сегодня? Сохраняется само.">${esc(day.wellbeing || '')}</textarea></div>`;
    const focus = S.items.filter((i) => i.focus === t).sort((a, b) => (a.status === 'done') - (b.status === 'done') || byCreated(a, b));
    h += `<div class="group-title">⭐ Фокус дня <span class="n">${focus.filter((i) => i.status !== 'done').length}</span></div>`;
    h += focus.length ? list(focus, { star: true, showStatus: true }) : empty('⭐', 'Фокус на сегодня не выбран.<br>Отметь звёздочкой 1–3 задачи в «Следующих действиях».');
    const cal = S.items.filter((i) => i.status !== 'done' && i.due && i.due <= t && i.focus !== t).sort((a, b) => a.due.localeCompare(b.due));
    if (cal.length) h += `<div class="group-title">📅 Сроки: сегодня и просрочено <span class="n">${cal.length}</span></div>` + list(cal, { star: true, showStatus: true });
    const inbox = items('inbox').length;
    if (inbox) h += `<div class="cta"><p><b>Во Входящих ${inbox} ${plural(inbox, 'пункт', 'пункта', 'пунктов')}.</b></p><button type="button" class="btn primary" data-action="process">Разобрать →</button></div>`;
    if (day.summary) h += `<div class="group-title">Итог дня</div><div class="panel">${esc(day.summary)}</div>`;
    return h;
  },

  inbox() {
    const arr = items('inbox').sort(byCreated);
    let h = head('inbox');
    if (arr.length) {
      h += `<div class="cta"><p><b>${arr.length} ${plural(arr.length, 'пункт ждёт', 'пункта ждут', 'пунктов ждут')} разбора.</b><br><span style="color:var(--muted);font-size:14px">Мастер задаст 2–4 вопроса про каждый пункт.</span></p>
        <button type="button" class="btn primary" data-action="process">Разобрать →</button></div>`;
      h += '<ul class="list">' + arr.map((i) => itemRow(i, { side: `<button type="button" class="btn sm ghost" data-action="process" data-id="${i.id}">Разобрать</button>` })).join('') + '</ul>';
    } else {
      h += empty('🎉', 'Входящие пусты. Голова свободна.<br>Как только что-то придёт в голову, запиши в поле сверху.');
    }
    return h;
  },

  next() {
    const all = items('next');
    const ctxs = S.contexts;
    const pill = (key, val, label) => `<button type="button" class="pill ${UI[key] === val ? 'on' : ''}" data-action="filter" data-key="${key}" data-val="${esc(val)}">${esc(label)}</button>`;
    let h = head('next');
    h += `<div class="filters">
      <div class="frow"><span class="flabel">Где я сейчас:</span>${pill('ctx', 'all', 'Везде')}${ctxs.map((c) => pill('ctx', c, c)).join('')}${pill('ctx', 'none', 'Без контекста')}</div>
      <div class="frow"><span class="flabel">Есть времени:</span>${pill('time', 'any', 'Сколько угодно')}${TIMES.slice(0, 3).map((t) => pill('time', t[0], 'до ' + t[1])).join('')}</div>
      <div class="frow"><span class="flabel">Сил:</span>${pill('energy', 'any', 'Любые')}${pill('energy', 'low', 'Мало')}${pill('energy', 'mid', 'Средне')}</div>
    </div>`;
    const eRank = { low: 1, mid: 2, high: 3 };
    const filtered = all.filter((i) => {
      if (UI.ctx === 'none' && i.context) return false;
      if (UI.ctx !== 'all' && UI.ctx !== 'none' && i.context !== UI.ctx && i.context !== '@везде') return false;
      if (UI.time !== 'any' && i.time && Number(i.time) > Number(UI.time)) return false;
      if (UI.energy !== 'any' && i.energy && eRank[i.energy] > eRank[UI.energy]) return false;
      return true;
    });
    if (!all.length) return h + empty('🌱', 'Пока нет следующих действий.<br>Они появятся, когда разберёшь Входящие.');
    if (!filtered.length) return h + empty('🔍', 'Под эти условия ничего не подходит.<br>Попробуй другой контекст или сними фильтры.');
    const groups = {};
    filtered.forEach((i) => { (groups[i.context || 'Без контекста'] ||= []).push(i); });
    const order = [...ctxs, 'Без контекста'].filter((c) => groups[c]).concat(Object.keys(groups).filter((c) => !ctxs.includes(c) && c !== 'Без контекста'));
    order.forEach((c) => {
      const arr = groups[c].sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999') || byCreated(a, b));
      h += `<div class="group-title">${esc(c)} <span class="n">${arr.length}</span></div>` + list(arr, { star: true });
    });
    return h;
  },

  calendar() {
    const arr = items('calendar').sort((a, b) => (a.due || '').localeCompare(b.due || ''));
    let h = head('calendar');
    if (!arr.length) return h + empty('📅', 'Нет дел, привязанных к датам.');
    const t = today(), tm = addDays(1), wk = addDays(7);
    const g = [['Просрочено', (i) => i.due < t], ['Сегодня', (i) => i.due === t], ['Завтра', (i) => i.due === tm], ['На этой неделе', (i) => i.due > tm && i.due <= wk], ['Позже', (i) => i.due > wk]];
    g.forEach(([title, fn]) => {
      const sub = arr.filter((i) => i.due && fn(i));
      if (sub.length) h += `<div class="group-title">${title} <span class="n">${sub.length}</span></div>` + list(sub, { star: true });
    });
    const nodate = arr.filter((i) => !i.due);
    if (nodate.length) h += `<div class="group-title">Без даты (поставь дату или перенеси)</div>` + list(nodate, { star: true });
    return h;
  },

  waiting() {
    const arr = items('waiting').sort(byCreated);
    let h = head('waiting');
    if (!arr.length) return h + empty('⏳', 'Ты ничего ни от кого не ждёшь.');
    return h + list(arr, { age: true });
  },

  projects() {
    let h = head('projects');
    h += `<form class="inline-add" data-form="addProject" style="margin-bottom:16px">
      <input name="title" id="newProjectTitle" placeholder="Новый проект: например, «Запустить лендинг»" aria-label="Название проекта">
      <button class="btn primary" type="submit">Создать</button></form>`;
    const active = S.projects.filter((p) => p.status === 'active');
    const stuck = active.filter((p) => !projectMoving(p));
    const ok = active.filter((p) => projectMoving(p));
    if (!active.length) h += empty('📁', 'Активных проектов нет.<br>Они появляются при разборе, когда пункту нужно больше одного шага, или их можно создать здесь.');
    const card = (p) => {
      const tasks = S.items.filter((i) => i.projectId === p.id && i.status !== 'done' && i.status !== 'inbox');
      const isStuck = !projectMoving(p);
      return `<div class="proj ${isStuck ? 'stuck' : ''}">
        <div class="proj-head">
          <div style="flex:1;min-width:0">
            <div class="proj-title" data-action="editProject" data-id="${p.id}">${esc(p.title)}</div>
            ${p.outcome ? `<div class="proj-outcome">🎯 ${esc(p.outcome)}</div>` : ''}
          </div>
          <button type="button" class="btn sm" data-action="projectDone" data-id="${p.id}">Завершить</button>
        </div>
        ${isStuck ? '<div class="proj-warn">⚠️ Нет следующего действия, проект стоит. Какой самый первый шаг можно сделать прямо сейчас?</div>' : ''}
        ${tasks.length ? list(tasks, { noProject: true, star: true }) : ''}
        <form class="inline-add" data-form="addStep" data-id="${p.id}">
          <input name="title" id="step-${p.id}" placeholder="Следующее действие: глагол + что именно" aria-label="Следующее действие">
          <select name="context" aria-label="Контекст">
            <option value="">контекст</option>${S.contexts.map((c) => `<option>${esc(c)}</option>`).join('')}
          </select>
          <button class="btn sm" type="submit">Добавить</button></form>
      </div>`;
    };
    if (stuck.length) h += `<div class="group-title">Требуют внимания <span class="n">${stuck.length}</span></div>` + stuck.map(card).join('');
    if (ok.length) h += `<div class="group-title">В работе <span class="n">${ok.length}</span></div>` + ok.map(card).join('');
    const later = S.projects.filter((p) => p.status === 'someday');
    if (later.length) h += `<div class="group-title">Отложенные (когда-нибудь)</div><ul class="list">${later.map((p) => `<li class="item"><div class="item-main" data-action="editProject" data-id="${p.id}"><div class="item-title">${esc(p.title)}</div></div><div class="item-side"><button type="button" class="btn sm" data-action="projectActivate" data-id="${p.id}">Начать</button></div></li>`).join('')}</ul>`;
    const done = S.projects.filter((p) => p.status === 'done');
    if (done.length) h += `<div class="group-title">Завершённые <span class="n">${done.length}</span></div><ul class="list">${done.map((p) => `<li class="item is-done"><div class="item-main" data-action="editProject" data-id="${p.id}"><div class="item-title">${esc(p.title)}</div></div></li>`).join('')}</ul>`;
    return h;
  },

  someday() {
    const arr = items('someday').sort(byCreated);
    let h = head('someday');
    if (!arr.length) return h + empty('💭', 'Тут будут идеи «может, когда-нибудь».');
    h += '<ul class="list">' + arr.map((i) => itemRow(i, { noCheck: true, side: `<button type="button" class="btn sm" data-action="activate" data-id="${i.id}" title="Вернуть во Входящие и разобрать заново">Пора делать</button>` })).join('') + '</ul>';
    return h;
  },

  reference() {
    const arr = items('reference').sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    let h = head('reference');
    if (!arr.length) return h + empty('📚', 'Справочных материалов пока нет.');
    return h + list(arr, { noCheck: true, notes: true });
  },

  done() {
    const arr = items('done').sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
    let h = head('done');
    if (!arr.length) return h + empty('✅', 'Тут появится всё сделанное.');
    const groups = {};
    arr.forEach((i) => { const k = i.doneAt ? fmtDate(dateStr(new Date(i.doneAt))) : 'раньше'; (groups[k] ||= []).push(i); });
    Object.keys(groups).forEach((k) => { h += `<div class="group-title">${esc(k)} <span class="n">${groups[k].length}</span></div>` + list(groups[k]); });
    const old = arr.filter((i) => i.doneAt && daysAgo(i.doneAt) > 30).length;
    if (old) h += `<button type="button" class="btn sm ghost" data-action="clearDone">Удалить сделанное старше 30 дней (${old})</button>`;
    return h;
  },

  sleep() {
    let h = head('sleep');
    const t = today();
    const days14 = lastDays(14);
    const last7 = lastDays(7).filter((d) => sleepOf(d).length);
    const avg = last7.length ? last7.reduce((s, d) => s + sleepTotal(d), 0) / last7.length : null;
    const nights = S.sleep.filter((s) => s.type === 'night' && s.day >= addDays(-6) && s.start);
    let bed = null;
    if (nights.length) {
      const mins = nights.map((s) => { const m = Number(s.start.slice(11, 13)) * 60 + Number(s.start.slice(14, 16)); return m < 12 * 60 ? m + 1440 : m; });
      const a = Math.round(mins.reduce((x, y) => x + y, 0) / mins.length) % 1440;
      bed = pad(Math.floor(a / 60)) + ':' + pad(a % 60);
    }
    h += `<div class="tiles">
      <div class="tile"><div class="k">Сегодня</div><div class="v">${sleepOf(t).length ? esc(fmtHours(sleepTotal(t))) : '—'}</div><div class="d">${sleepOf(t).length ? sleepOf(t).length + ' ' + plural(sleepOf(t).length, 'отрезок', 'отрезка', 'отрезков') : 'не внесён'}</div></div>
      <div class="tile"><div class="k">В среднем за 7 дней</div><div class="v">${avg != null ? esc(fmtHours(avg)) : '—'}</div><div class="d">${last7.length ? 'по ' + last7.length + ' ' + plural(last7.length, 'дню', 'дням', 'дням') + ' с записями' : 'нет данных'}</div></div>
      <div class="tile"><div class="k">Средний отбой</div><div class="v">${bed || '—'}</div><div class="d">цель: 00:00–01:00, не позже 02:00</div></div>
    </div>`;
    h += `<div class="panel"><h3>Сон по дням, часов</h3>${barChart(dayLabels(days14), [
      { name: 'Ночной', color: 'var(--accent)', values: days14.map((d) => sleepOf(d).filter((s) => s.type === 'night').reduce((x, s) => x + sleepHours(s), 0)) },
      { name: 'Досып после садика', color: 'var(--nap)', values: days14.map((d) => sleepOf(d).filter((s) => s.type === 'nap').reduce((x, s) => x + sleepHours(s), 0)) },
      { name: 'Днём', color: 'var(--warn)', values: days14.map((d) => sleepOf(d).filter((s) => s.type === 'day').reduce((x, s) => x + sleepHours(s), 0)) },
    ], (v) => fmt1(v))}</div>`;
    h += `<div class="panel"><h3>Добавить отрезок сна</h3>
      <form data-form="addSleep" autocomplete="off"><div class="form-grid">
        <div class="field"><label for="slType">Тип</label><select id="slType" name="type">${opt(SLEEP_TYPES, 'night')}</select></div>
        <div class="field"><label for="slStart">Лёг</label><input type="datetime-local" id="slStart" name="start" required></div>
        <div class="field"><label for="slEnd">Встал</label><input type="datetime-local" id="slEnd" name="end" required></div>
        <div class="field"><label for="slQ">Качество</label><select id="slQ" name="quality"><option value="">—</option>${opt([['1', '1 — плохо'], ['2', '2'], ['3', '3 — нормально'], ['4', '4'], ['5', '5 — отлично']], '')}</select></div>
      </div><button class="btn primary" type="submit">Добавить</button></form></div>`;
    const daysWith = [...new Set(S.sleep.map((s) => s.day))].filter(Boolean).sort().reverse().slice(0, 21);
    if (!daysWith.length) return h + empty('🌙', 'Записей сна пока нет.<br>Добавь отрезок выше или расскажи Claude утром, во сколько лёг и встал.');
    daysWith.forEach((d) => {
      const arr = sleepOf(d);
      h += `<div class="group-title">${esc(fmtDate(d))} <span class="n num">${esc(fmtHours(sleepTotal(d)))}</span></div><ul class="list">` + arr.map((s) => `<li class="item"><div class="item-main" data-action="editSleep" data-id="${s.id}">
        <div class="item-title num">${hm(s.start)} → ${hm(s.end)} <span style="color:var(--muted)">· ${esc(fmtHours(sleepHours(s)))}</span></div>
        <div class="chips"><span class="chip ${s.type === 'night' ? 'ctx' : ''}">${esc(labelOf(SLEEP_TYPES, s.type))}</span>${s.quality ? `<span class="chip">качество ${s.quality}/5</span>` : ''}${s.notes ? `<span class="chip">${esc(s.notes)}</span>` : ''}</div>
        </div></li>`).join('') + '</ul>';
    });
    return h;
  },

  food() {
    let h = head('food');
    const d = UI.foodDate || today();
    const ft = foodTotals(d);
    h += `<div class="daynav"><button type="button" class="btn sm" data-action="foodDay" data-val="-1" aria-label="Предыдущий день">←</button><b>${esc(fmtDate(d))}</b><button type="button" class="btn sm" data-action="foodDay" data-val="1" aria-label="Следующий день" ${d >= today() ? 'disabled' : ''}>→</button>${d !== today() ? '<button type="button" class="btn sm ghost" data-action="foodDay" data-val="0">К сегодня</button>' : ''}</div>`;
    h += `<div class="tiles">
      <div class="tile"><div class="k">Калории</div><div class="v">${ft.n ? fmt0(ft.kcal) + '<small> ккал</small>' : '—'}</div><div class="d">≈ оценка</div></div>
      <div class="tile"><div class="k">Белки</div><div class="v">${ft.n ? fmt0(ft.p) + '<small> г</small>' : '—'}</div></div>
      <div class="tile"><div class="k">Жиры</div><div class="v">${ft.n ? fmt0(ft.f) + '<small> г</small>' : '—'}</div></div>
      <div class="tile"><div class="k">Углеводы</div><div class="v">${ft.n ? fmt0(ft.c) + '<small> г</small>' : '—'}</div></div>
    </div>`;
    const arr = mealsOf(d);
    h += arr.length ? '<ul class="list">' + arr.map((m) => `<li class="item"><div class="item-main" data-action="editMeal" data-id="${m.id}">
        <div class="item-title">${esc(m.title)}</div>
        <div class="chips"><span class="chip ctx">${esc(labelOf(MEALS, m.meal) || 'Приём')}${m.time ? ' · ' + esc(m.time) : ''}</span>${m.grams ? `<span class="chip num">${fmt0(m.grams)} г</span>` : ''}${m.kcal != null ? `<span class="chip num">${fmt0(m.kcal)} ккал</span>` : ''}<span class="chip num">Б ${fmt0(m.protein || 0)} · Ж ${fmt0(m.fat || 0)} · У ${fmt0(m.carbs || 0)}</span>${m.source && m.source !== 'manual' ? `<span class="chip">≈ ${esc(labelOf(SOURCES, m.source))}</span>` : ''}</div>
      </div></li>`).join('') + '</ul>' : empty('🍽', 'За этот день еды нет.<br>Пришли Claude фото или описание, или добавь вручную ниже.');
    h += `<div class="panel"><h3>Добавить приём пищи</h3>
      <form data-form="addMeal" autocomplete="off">
        <div class="field"><label for="mlTitle">Блюдо</label><input id="mlTitle" name="title" required placeholder="Например: курица с картошкой"></div>
        <div class="form-grid">
          <div class="field"><label for="mlMeal">Приём</label><select id="mlMeal" name="meal">${opt(MEALS, 'lunch')}</select></div>
          <div class="field"><label for="mlTime">Время</label><input type="time" id="mlTime" name="time"></div>
          <div class="field"><label for="mlGrams">Вес, г</label><input id="mlGrams" name="grams" inputmode="decimal"></div>
          <div class="field"><label for="mlKcal">Ккал</label><input id="mlKcal" name="kcal" inputmode="decimal"></div>
          <div class="field"><label for="mlP">Белки, г</label><input id="mlP" name="protein" inputmode="decimal"></div>
          <div class="field"><label for="mlF">Жиры, г</label><input id="mlF" name="fat" inputmode="decimal"></div>
          <div class="field"><label for="mlC">Углеводы, г</label><input id="mlC" name="carbs" inputmode="decimal"></div>
        </div>
        <button class="btn primary" type="submit">Добавить</button></form></div>`;
    const days14 = lastDays(14);
    h += `<div class="panel"><h3>Калории по дням</h3>${barChart(dayLabels(days14), [{ name: 'Ккал', color: 'var(--warn)', values: days14.map((x) => foodTotals(x).kcal) }], (v) => fmt0(v))}</div>`;
    return h;
  },

  review() {
    let h = head('review', S.review.lastDone ? `Последний обзор: ${fmtDate(dateStr(new Date(S.review.lastDone)))} (${daysAgo(S.review.lastDone)} дн. назад)` : 'Ты ещё ни разу не проводил обзор.');
    const n = { inbox: items('inbox').length, next: items('next').length, waiting: items('waiting').length, someday: items('someday').length, stuck: stuckProjects().length, cal: items('calendar').length };
    const steps = [
      ['Очистить', [
        ['collect', 'Собрать всё в одно место', 'Бумажки, заметки в телефоне, сообщения «напомни мне», открытые вкладки. Всё, что требует внимания, запиши в поле сверху.'],
        ['mind', 'Выгрузить голову', 'Пробегись по сферам: работа, Ритмология, дом, здоровье, деньги, люди, обещания. Что «висит»? Запиши во Входящие.'],
        ['inbox', `Разобрать Входящие до нуля${n.inbox ? ` (сейчас ${n.inbox})` : ''}`, 'Мастер разбора задаст вопросы по каждому пункту.', 'process'],
      ]],
      ['Актуализировать', [
        ['calendar', 'Посмотреть календарь', 'Прошлая неделя: остались ли хвосты? Следующие две недели: что нужно подготовить заранее?', 'calendar'],
        ['next', `Пройтись по Следующим действиям (${n.next})`, 'Отметь сделанное, удали неактуальное. Каждая формулировка должна быть понятным физическим действием.', 'next'],
        ['waiting', `Проверить Ожидание (${n.waiting})`, 'Кому пора напомнить?', 'waiting'],
        ['projects', `Проекты${n.stuck ? `: ${n.stuck} без следующего шага` : ''}`, 'У каждого активного проекта должно быть следующее действие. Закрой завершённые.', 'projects'],
      ]],
      ['Подумать', [
        ['someday', `Просмотреть «Когда-нибудь» (${n.someday})`, 'Что-то пора начать? Что-то уже неактуально? Удали.', 'someday'],
        ['new', 'Новые идеи', 'Что хочется начать? Какие проекты появились? Запиши во Входящие.'],
      ]],
    ];
    let k = 0;
    steps.forEach(([phase, arr]) => {
      h += `<div class="rphase">${phase}</div>`;
      arr.forEach(([id, title, text, link]) => {
        k++;
        const done = !!S.review.checks[id];
        const btn = link === 'process' ? (n.inbox ? '<button type="button" class="btn sm" data-action="process">Разобрать</button>' : '') : link ? `<button type="button" class="btn sm" data-action="go" data-view="${link}">Открыть</button>` : '';
        h += `<div class="rstep ${done ? 'done' : ''}">

function render() {
  if (DB_STATE === 'off') {
    $('#nav').innerHTML = '';
    $('#view').innerHTML = empty('🔌', 'База данных недоступна в этом окне.<br>Открой Personal Hub по ссылке на claude.ai, войдя в свой аккаунт.');
    return;
  }
  if (!isReady()) { $('#view').innerHTML = '<div class="loading">Загружаю данные…</div>'; return; }
  const fresh = !META_EXISTS && !S.items.length && !S.projects.length && !S.sleep.length && !S.meals.length;
  renderNav();
  if (fresh) { $('#view').innerHTML = ''; if (modalKind !== 'welcome') openWelcome(); return; }
  if (modalKind === 'welcome') { modalKind = null; $('#modal').hidden = true; }
  const fn = VIEW_RENDER[UI.view] || VIEW_RENDER.today;
  $('#view').innerHTML = fn();
  growAll($('#view'));
  renderUrgent();
  if (modalKind === 'process') renderProcess();
}

/* ---------- urgent ---------- */
function urgentItems() {
  return S.items.filter((i) => i.urgent && i.status !== 'done')
    .sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999') || byCreated(a, b));
}
function daysLeftLabel(due) {
  if (!due) return '';
  const n = Math.round((parseDate(due) - parseDate(today())) / 86400000);
  if (n < 0) return 'просрочено на ' + (-n) + ' ' + plural(-n, 'день', 'дня', 'дней');
  if (n === 0) return 'срок сегодня';
  if (n === 1) return 'срок завтра';
  return 'осталось ' + n + ' ' + plural(n, 'день', 'дня', 'дней');
}
function renderUrgent() {
  const bar = $('#urgentBar');
  if (!bar) return;
  const arr = urgentItems();
  bar.hidden = !arr.length;
  bar.innerHTML = arr.map((it) => {
    const near = it.due && Math.round((parseDate(it.due) - parseDate(today())) / 86400000) <= 1;
    return `<div class="urgent-row ${near ? 'pulse' : ''}">
      <button type="button" class="check" data-action="toggle" data-id="${it.id}" aria-label="Отметить сделанным" title="Сделано"></button>
      <div class="ut" data-action="edit" data-id="${it.id}"><b>🔥 Срочно:</b> ${esc(it.title)}</div>
      ${it.due ? `<span class="ud">${esc(fmtDate(it.due))} · ${esc(daysLeftLabel(it.due))}</span>` : ''}
    </div>`;
  }).join('');
}

/* ---------- modal ---------- */
function openModal(kind, html) {
  modalKind = kind;
  $('#sheet').innerHTML = html;
  $('#modal').hidden = false;
  growAll($('#sheet'));
  const f = $('#sheet [autofocus]');
  if (f) setTimeout(() => f.focus(), 30);
}
/* textarea grows with its text, up to ~60% of the screen */
function autoGrow(el) {
  if (!el || el.tagName !== 'TEXTAREA') return;
  el.style.height = 'auto';
  const max = Math.max(160, Math.round(window.innerHeight * 0.6));
  el.style.height = Math.min(el.scrollHeight + 2, max) + 'px';
}
function growAll(root) { if (root) root.querySelectorAll('textarea').forEach(autoGrow); }
document.addEventListener('input', (e) => autoGrow(e.target));
function closeModal() {
  if (modalKind === 'welcome') return;
  $('#modal').hidden = true;
  modalKind = null;
  P = null;
  CONFIRM_FN = null;
  render();
}
function askConfirm(text, okLabel, fn) {
  CONFIRM_FN = fn;
  openModal('confirm', `<div class="q" style="font-size:17px">${esc(text).replace(/\n/g, '<br>')}</div>
    <div class="sheet-actions"><span class="spacer"></span><button type="button" class="btn" data-action="close">Отмена</button>
    <button type="button" class="btn primary" data-action="confirmOk">${esc(okLabel)}</button></div>`);
}

/* ---------- process wizard ---------- */
function startProcess(id) {
  const ids = items('inbox').sort(byCreated).map((i) => i.id);
  if (!ids.length) return;
  let idx = id ? ids.indexOf(id) : 0;
  if (idx < 0) idx = 0;
  P = { ids, idx, done: 0, total: ids.length };
  resetDraft();
  modalKind = 'process';
  $('#modal').hidden = false;
  renderProcess();
}
function resetDraft() {
  const it = curItem();
  Object.assign(P, { step: it ? 'actionable' : 'empty', hist: [], trail: [], title: it ? it.title : '', newProject: null, sel: { context: null, time: null, energy: null } });
}
function curItem() {
  while (P.idx < P.ids.length) {
    const it = getItem(P.ids[P.idx]);
    if (it && it.status === 'inbox') return it;
    P.idx++;
  }
  return null;
}
function step(next, label) { readTitle(); P.hist.push(P.step); P.trail.push(label); P.step = next; renderProcess(); }
function stepBack() { if (!P.hist.length) return; P.step = P.hist.pop(); P.trail.pop(); if (P.step === 'project') P.newProject = null; renderProcess(); }
function readTitle() { const el = $('#pTitle'); if (el) P.title = el.value; }
function commit(status, extra, msg) {
  readTitle();
  const it = curItem();
  if (!it) return;
  if (status === 'trash') {
    S.items = S.items.filter((i) => i.id !== it.id);
  } else {
    it.title = (P.title || '').trim() || it.title;
    if (P.newProject) { const p = newProject(P.newProject.title, { outcome: P.newProject.outcome }); it.projectId = p.id; }
    Object.assign(it, { status }, extra || {});
    if (status === 'done') it.doneAt = Date.now();
  }
  save();
  P.done++;
  P.idx++;
  resetDraft();
  renderNav();
  $('#view').innerHTML = (VIEW_RENDER[UI.view] || VIEW_RENDER.today)();
  renderProcess();
  if (msg) toast(msg);
}

const choice = (action, ico, title, sub, data = '') => `<button type="button" class="choice" data-action="${action}" ${data}><span class="ci" aria-hidden="true">${ico}</span><span><b>${title}</b>${sub ? `<span>${sub}</span>` : ''}</span></button>`;

function renderProcess() {
  if (!P) return;
  const it = curItem();
  if (!it) P.step = 'empty';
  const total = P.total;
  const pos = Math.min(P.done + 1, total);
  let top = `<div class="sheet-top"><span>Разбор Входящих · ${P.step === 'empty' ? 'готово' : `пункт ${pos} из ${total}`}</span><button type="button" class="btn sm ghost x" data-action="close">✕ Закрыть</button></div>
    <div class="progress"><div style="width:${(P.done / total) * 100}%"></div></div>`;
  if (P.step === 'empty') {
    $('#sheet').innerHTML = top + `<div style="text-align:center;padding:12px 0 4px"><div style="font-size:44px" aria-hidden="true">🎉</div><div class="q">Входящие пусты!</div>
      <p class="qhint">Разобрано: ${P.done}. Теперь загляни в «Следующие действия»: там всё, что можно делать.</p>
      <div class="row" style="justify-content:center"><button type="button" class="btn primary" data-action="finishProcess" data-view="next">К Следующим действиям</button><button type="button" class="btn" data-action="close">Закрыть</button></div></div>`;
    return;
  }
  const editable = P.step === 'actionable';
  let h = top + (editable
    ? `<input class="pitem-edit" id="pTitle" value="${esc(P.title)}" aria-label="Формулировка">`
    : `<div class="pitem">${esc(P.title)}</div>`);
  h += `<div class="trail">${P.trail.map((t) => `<span>${esc(t)}</span>`).join('')}</div>`;
  const back = P.hist.length ? '<button type="button" class="btn ghost" data-action="pBack">← Назад</button>' : '';
  const skip = '<button type="button" class="btn ghost" data-action="pSkip" title="Оставить во Входящих и перейти к следующему">Пропустить</button>';
  const foot = (extra = '') => `<div class="sheet-actions">${back}<span class="spacer"></span>${extra}${skip}</div>`;

  switch (P.step) {
    case 'actionable':
      h += `<div class="q">Нужно ли с этим что-то делать?</div><p class="qhint">Формулировку сверху можно исправить. Например, расшифровать, что имелось в виду.</p>
        <div class="choices">${choice('pGo', '✅', 'Да, нужно действовать', 'Есть шаг, который надо сделать (мне или кому-то)', 'data-next="multi" data-label="Нужно действовать"')}
        ${choice('pGo', '🚫', 'Нет', 'Это идея, информация или уже неактуально', 'data-next="notActionable" data-label="Действовать не нужно"')}</div>` + foot();
      break;
    case 'notActionable':
      h += `<div class="q">Тогда что это?</div><p class="qhint">Пункты, по которым ничего не надо делать, не должны висеть в списках дел.</p>
        <div class="choices">${choice('pCommit', '🗑', 'Мусор: удалить', 'Неактуально, уже не важно', 'data-status="trash" data-msg="Удалено"')}
        ${choice('pCommit', '💭', 'Может быть, когда-нибудь', 'Идея, к которой стоит вернуться позже', 'data-status="someday" data-msg="В «Когда-нибудь»"')}
        ${choice('pCommit', '📚', 'Справка', 'Полезная информация, сохранить на будущее', 'data-status="reference" data-msg="В «Справку»"')}</div>` + foot();
      break;
    case 'multi':
      h += `<div class="q">Чтобы закрыть это, нужен один шаг или несколько?</div><p class="qhint">«Позвонить в банк» — один шаг. «Обновить лендинг» — много шагов, это проект.</p>
        <div class="choices">${choice('pGo', '1️⃣', 'Один шаг', 'Сделал, и вопрос закрыт', 'data-next="twoMin" data-label="Один шаг"')}
        ${choice('pGo', '📁', 'Несколько шагов: это проект', 'Создадим проект и определим первый шаг', 'data-next="project" data-label="Проект"')}</div>` + foot();
      break;
    case 'project': {
      const np = P.newProject || {};
      h += `<div class="q">Создаём проект</div><p class="qhint">Проект нельзя «сделать», делаются шаги. Поэтому сразу определим первый.</p>
        <div class="field"><label for="pjTitle">Название проекта</label><input id="pjTitle" value="${esc(np.title || P.title)}"></div>

        <div class="field"><label for="pjFirst">Самое первое физическое действие</label><input id="pjFirst" autofocus placeholder="Глагол + что именно: «Написать Ивану, какой хостинг он советует»"></div>`
        + foot('<button type="button" class="btn primary" data-action="pProject">Дальше →</button>');

    case 'twoMin':
      h += `<div class="q">Это займёт меньше 2 минут?</div><p class="qhint">Правило двух минут: короткое дело быстрее сделать, чем записывать и потом вспоминать.</p>

      break;
    case 'doNow':
      h += `<div class="q">Сделай это прямо сейчас 💪</div><p class="qhint">Окно подождёт. Когда закончишь, нажми кнопку.</p>
        <div class="choices">${choice('pCommit', '✅', 'Сделал!', '', 'data-status="done" data-msg="Готово! Отлично"')}

    case 'who':

      break;
    case 'delegate':
