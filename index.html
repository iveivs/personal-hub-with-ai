    <div class="grid2">
      <div class="field"><label for="eCtx">Контекст</label><select id="eCtx"><option value="">—</option>${opt(ctxs, it.context)}</select></div>
      <div class="field"><label for="eProj">Проект</label><select id="eProj"><option value="">—</option>${opt(S.projects.filter((p) => p.status !== 'done' || p.id === it.projectId).map((p) => [p.id, p.title]), it.projectId)}</select></div>
      <div class="field"><label for="eTime">Время</label><select id="eTime"><option value="">—</option>${opt(TIMES, it.time)}</select></div>
      <div class="field"><label for="eEnergy">Силы</label><select id="eEnergy"><option value="">—</option>${opt(ENERGY, it.energy)}</select></div>
      <div class="field"><label for="eDue">Дата (только жёсткая)</label><input type="date" id="eDue" value="${esc(it.due || '')}"></div>
      <div class="field"><label for="eWho">Жду от</label><input id="eWho" value="${esc(it.waitingFor || '')}"></div>
    </div>
    <div class="field"><label for="eNotes">Заметки</label><textarea id="eNotes">${esc(it.notes || '')}</textarea></div>
    <div class="sheet-actions">
      <button type="button" class="btn danger" data-action="deleteItem" data-id="${it.id}">Удалить</button>
      ${it.status !== 'inbox' ? `<button type="button" class="btn ghost" data-action="toInbox" data-id="${it.id}" title="Вернуть во Входящие и разобрать заново">Разобрать заново</button>` : ''}
      <span class="spacer"></span>
      <button type="button" class="btn" data-action="close">Отмена</button>
      <button type="button" class="btn primary" data-action="saveItem" data-id="${it.id}">Сохранить</button>
    </div>`);
}
function openEditProject(id) {
  const p = project(id);
  if (!p) return;
  openModal('editProject', `<div class="sheet-top"><span>Проект</span><button type="button" class="btn sm ghost x" data-action="close" aria-label="Закрыть">✕</button></div>
    <div class="field"><label for="pTitleE">Название</label><input id="pTitleE" value="${esc(p.title)}"></div>
    <div class="field"><label for="pOutE">Как выглядит «готово»</label><input id="pOutE" value="${esc(p.outcome || '')}"></div>
    <div class="field"><label for="pStatE">Статус</label><select id="pStatE">
      <option value="active" ${p.status === 'active' ? 'selected' : ''}>Активный</option>
      <option value="someday" ${p.status === 'someday' ? 'selected' : ''}>Отложен (когда-нибудь)</option>
      <option value="done" ${p.status === 'done' ? 'selected' : ''}>Завершён</option></select></div>
    <div class="sheet-actions">
      <button type="button" class="btn danger" data-action="deleteProject" data-id="${p.id}">Удалить проект</button>
      <span class="spacer"></span>
      <button type="button" class="btn" data-action="close">Отмена</button>
      <button type="button" class="btn primary" data-action="saveProject" data-id="${p.id}">Сохранить</button>
    </div>`);
}
function openEditSleep(id) {
  const s = S.sleep.find((x) => x.id === id);
  if (!s) return;
  openModal('editSleep', `<div class="sheet-top"><span>Отрезок сна</span><button type="button" class="btn sm ghost x" data-action="close" aria-label="Закрыть">✕</button></div>
    <div class="field"><label for="sType">Тип</label><select id="sType">${opt(SLEEP_TYPES, s.type)}</select></div>
    <div class="grid2">
      <div class="field"><label for="sStart">Лёг</label><input type="datetime-local" id="sStart" value="${esc(String(s.start || '').slice(0, 16))}"></div>
      <div class="field"><label for="sEnd">Встал</label><input type="datetime-local" id="sEnd" value="${esc(String(s.end || '').slice(0, 16))}"></div>
    </div>
    <div class="field"><label for="sQ">Качество</label><select id="sQ"><option value="">—</option>${opt([['1', '1 — плохо'], ['2', '2'], ['3', '3 — нормально'], ['4', '4'], ['5', '5 — отлично']], s.quality)}</select></div>
    <div class="field"><label for="sNotes">Заметка</label><input id="sNotes" value="${esc(s.notes || '')}"></div>
    <div class="sheet-actions">
      <button type="button" class="btn danger" data-action="deleteSleep" data-id="${s.id}">Удалить</button>
      <span class="spacer"></span>
      <button type="button" class="btn" data-action="close">Отмена</button>
      <button type="button" class="btn primary" data-action="saveSleep" data-id="${s.id}">Сохранить</button>
    </div>`);
}
function openEditMeal(id) {
  const m = S.meals.find((x) => x.id === id);
  if (!m) return;
  const f = (k, label, v) => `<div class="field"><label for="m_${k}">${label}</label><input id="m_${k}" inputmode="decimal" value="${v == null ? '' : esc(v)}"></div>`;
  openModal('editMeal', `<div class="sheet-top"><span>Приём пищи</span><button type="button" class="btn sm ghost x" data-action="close" aria-label="Закрыть">✕</button></div>
    <div class="field"><label for="m_title">Блюдо</label><input id="m_title" value="${esc(m.title)}"></div>
    <div class="grid2">
      <div class="field"><label for="m_meal">Приём</label><select id="m_meal">${opt(MEALS, m.meal)}</select></div>
      <div class="field"><label for="m_date">Дата</label><input type="date" id="m_date" value="${esc(m.date || '')}"></div>
      <div class="field"><label for="m_time">Время</label><input type="time" id="m_time" value="${esc(m.time || '')}"></div>
      ${f('grams', 'Вес, г', m.grams)}${f('kcal', 'Ккал', m.kcal)}${f('protein', 'Белки, г', m.protein)}${f('fat', 'Жиры, г', m.fat)}${f('carbs', 'Углеводы, г', m.carbs)}
    </div>
    <div class="field"><label for="m_notes">Заметка</label><input id="m_notes" value="${esc(m.notes || '')}"></div>
    ${m.source && m.source !== 'manual' ? `<p class="status-line">Значения — ${esc(labelOf(SOURCES, m.source).toLowerCase())}. После правки запись отметится как «вручную».</p>` : ''}
    <div class="sheet-actions">
      <button type="button" class="btn danger" data-action="deleteMeal" data-id="${m.id}">Удалить</button>
      <span class="spacer"></span>
      <button type="button" class="btn" data-action="close">Отмена</button>
      <button type="button" class="btn primary" data-action="saveMeal" data-id="${m.id}">Сохранить</button>
    </div>`);
}

/* ---------- import / export ---------- */
let PENDING_IMPORT = null;
function exportData() {
  return { exportedAt: new Date().toISOString(), items: S.items, projects: S.projects, contexts: S.contexts, review: S.review, sleep: S.sleep, meals: S.meals, days: S.days };
}

/* ---------- actions ---------- */
const A = {
  go(el) { UI.view = el.dataset.view; saveUI(); if (modalKind && modalKind !== 'welcome') { $('#modal').hidden = true; modalKind = null; P = null; } render(); window.scrollTo(0, 0); },
  hideHint(el) { UI.hidden[el.dataset.id] = true; saveUI(); render(); },
  showHints() { UI.hidden = {}; saveUI(); toast('Подсказки снова видны'); },
  filter(el) { UI[el.dataset.key] = el.dataset.val; saveUI(); render(); },
  close() { closeModal(); },
  confirmOk() { const fn = CONFIRM_FN; CONFIRM_FN = null; $('#modal').hidden = true; modalKind = null; P = null; if (fn) fn(); render(); },
  toggle(el) {
    const id = el.dataset.id;
    const it = getItem(id);
    if (!it) return;
    if (it.status === 'done') {
      it.status = it.prevStatus || 'next'; it.doneAt = null; save(); render(); toast('Вернул в «' + STATUS[it.status] + '»'); return;
    }
    const prev = it.status;
    it.prevStatus = prev; it.status = 'done'; it.doneAt = Date.now();
    save(); render();
    toast('Сделано ✓', () => { const x = getItem(id); if (!x) return; x.status = prev; x.doneAt = null; save(); render(); });
  },
  focus(el) { const it = getItem(el.dataset.id); if (!it) return; const t = today(); it.focus = it.focus === t ? null : t; save(); render(); toast(it.focus ? 'В фокусе на сегодня ⭐' : 'Убрал из фокуса'); },
  edit(el) { openEdit(el.dataset.id); },
  saveItem(el) {
    const it = getItem(el.dataset.id);
    if (!it) { closeModal(); return; }
    const v = (id) => $('#' + id).value;
    it.title = v('eTitle').trim() || it.title;
    const st = v('eStatus');
    if (st === 'done' && it.status !== 'done') { it.prevStatus = it.status; it.doneAt = Date.now(); }
    if (st !== 'done') it.doneAt = null;
    it.status = st;
    it.context = v('eCtx') || null; it.projectId = v('eProj') || null; it.time = v('eTime') || null; it.energy = v('eEnergy') || null;
    it.due = v('eDue') || null; it.waitingFor = v('eWho').trim(); it.notes = v('eNotes');
    it.focus = $('#eFocus').checked ? today() : (it.focus === today() ? null : it.focus || null);
    it.urgent = $('#eUrgent').checked;
    if (st === 'calendar' && !it.due) toast('Для Календаря лучше указать дату');
    save(); closeModal();
  },
  deleteItem(el) {
    const idx = S.items.findIndex((i) => i.id === el.dataset.id);
    if (idx < 0) return;
    const [it] = S.items.splice(idx, 1);
    save(); closeModal();
    toast('Удалено', () => { S.items.push(it); save(); render(); });
  },
  toInbox(el) { const it = getItem(el.dataset.id); if (!it) return; it.status = 'inbox'; it.doneAt = null; save(); closeModal(); toast('Вернул во Входящие'); },
  activate(el) { const it = getItem(el.dataset.id); if (!it) return; it.status = 'inbox'; save(); render(); toast('Во Входящих. Разбери его, чтобы определить следующий шаг'); },
  clearDone() {
    const n = S.items.filter((i) => i.status === 'done' && i.doneAt && daysAgo(i.doneAt) > 30).length;
    askConfirm(`Удалить ${n} ${plural(n, 'сделанную задачу', 'сделанные задачи', 'сделанных задач')} старше 30 дней?`, 'Удалить', () => {
      S.items = S.items.filter((i) => !(i.status === 'done' && i.doneAt && daysAgo(i.doneAt) > 30)); save();
    });
  },

  editProject(el) { openEditProject(el.dataset.id); },
  saveProject(el) {
    const p = project(el.dataset.id);
    if (!p) { closeModal(); return; }
    p.title = $('#pTitleE').value.trim() || p.title; p.outcome = $('#pOutE').value.trim(); p.status = $('#pStatE').value;
    save(); closeModal();
  },
  deleteProject(el) {
    const id = el.dataset.id, p = project(id);
    if (!p) return;
    const n = S.items.filter((i) => i.projectId === id && i.status !== 'done').length;
    askConfirm(`Удалить проект «${p.title}»?` + (n ? `\nЕго ${n} ${plural(n, 'задача останется', 'задачи останутся', 'задач останутся')} без проекта.` : ''), 'Удалить проект', () => {
      S.projects = S.projects.filter((x) => x.id !== id);
      S.items.forEach((i) => { if (i.projectId === id) i.projectId = null; });
      save();
    });
  },
  projectDone(el) {
    const id = el.dataset.id, p = project(id);
    if (!p) return;
    const openTasks = () => S.items.filter((i) => i.projectId === id && !['done', 'reference', 'someday'].includes(i.status));
    const finish = () => {
      const pp = project(id); if (!pp) return;
      openTasks().forEach((i) => { i.prevStatus = i.status; i.status = 'done'; i.doneAt = Date.now(); });
      pp.status = 'done'; save(); toast('Проект завершён 🎉');
    };
    const n = openTasks().length;
    if (n) askConfirm(`У проекта ещё ${n} ${plural(n, 'открытая задача', 'открытые задачи', 'открытых задач')}. Отметить их сделанными и закрыть проект?`, 'Закрыть проект', finish);
    else { finish(); render(); }
  },
  projectActivate(el) { const p = project(el.dataset.id); if (!p) return; p.status = 'active'; save(); render(); toast('Проект активен. Добавь ему следующее действие'); },

  process(el) { startProcess(el.dataset.id); },
  finishProcess(el) { $('#modal').hidden = true; modalKind = null; P = null; UI.view = el.dataset.view; saveUI(); render(); },
  pGo(el) { step(el.dataset.next, el.dataset.label); },
  pBack() { stepBack(); },
  pSkip() { readTitle(); P.idx++; P.done++; resetDraft(); renderProcess(); },
  pCommit(el) { commit(el.dataset.status, null, el.dataset.msg); },
  pProject() {
    const first = $('#pjFirst').value.trim();
    if (!first) { $('#pjFirst').focus(); toast('Напиши первый шаг: без него проект будет стоять'); return; }
    P.newProject = { title: $('#pjTitle').value.trim() || P.title, outcome: $('#pjOutcome').value.trim() };
    P.hist.push(P.step); P.trail.push('Проект «' + P.newProject.title + '»'); P.title = first; P.step = 'twoMin';
    renderProcess();
  },
  pDelegate() { const who = $('#pWho').value.trim(); commit('waiting', { waitingFor: who, createdAt: Date.now() }, 'В «Ожидание»'); },
  pDateQuick(el) { $('#pDate').value = el.dataset.val; document.querySelectorAll('[data-action=pDateQuick]').forEach((b) => b.classList.toggle('on', b === el)); },
  pDate() { const d = $('#pDate').value; if (!d) { toast('Выбери дату'); return; } commit('calendar', { due: d }, 'В Календарь на ' + fmtDate(d)); },
  pSel(el) { const k = el.dataset.key, v = el.dataset.val; P.sel[k] = P.sel[k] === v ? null : v; renderProcess(); },
  pNext() { commit('next', { context: P.sel.context, time: P.sel.time, energy: P.sel.energy }, 'В Следующие действия'); },

  reviewCheck(el) { const id = el.dataset.id; S.review.checks[id] = !S.review.checks[id]; save(); render(); },
  reviewReset() { S.review.checks = {}; save(); render(); },
  reviewFinish() { S.review.lastDone = Date.now(); S.review.checks = {}; save(); render(); toast('Обзор завершён. Система в порядке 🧘'); },

  startEmpty() { save(); modalKind = null; $('#modal').hidden = true; UI.view = 'today'; saveUI(); render(); },

  setEnergy(el) { const t = today(); const n = Number(el.dataset.val); setDay(t, { energy: (S.days[t] || {}).energy === n ? null : n }); render(); },
  foodDay(el) { const d = Number(el.dataset.val); UI.foodDate = d === 0 ? today() : addDays(d, UI.foodDate || today()); if (UI.foodDate > today()) UI.foodDate = today(); render(); },
  editSleep(el) { openEditSleep(el.dataset.id); },
  saveSleep(el) {
    const s = S.sleep.find((x) => x.id === el.dataset.id);
    if (!s) { closeModal(); return; }
    const start = $('#sStart').value, end = $('#sEnd').value;
    if (!start || !end || new Date(end) <= new Date(start)) { toast('Проверь время: «встал» должно быть позже «лёг»'); return; }
    Object.assign(s, { type: $('#sType').value, start, end, day: end.slice(0, 10), quality: $('#sQ').value ? Number($('#sQ').value) : null, notes: $('#sNotes').value.trim() });
    save(); closeModal();
  },
  deleteSleep(el) {
    const idx = S.sleep.findIndex((x) => x.id === el.dataset.id);
    if (idx < 0) return;
    const [s] = S.sleep.splice(idx, 1);
    save(); closeModal();
    toast('Удалено', () => { S.sleep.push(s); save(); render(); });
  },
  editMeal(el) { openEditMeal(el.dataset.id); },
  saveMeal(el) {
    const m = S.meals.find((x) => x.id === el.dataset.id);
    if (!m) { closeModal(); return; }
    const before = stable([m.grams, m.kcal, m.protein, m.fat, m.carbs, m.title]);
    m.title = $('#m_title').value.trim() || m.title;
    m.meal = $('#m_meal').value; m.date = $('#m_date').value || m.date; m.time = $('#m_time').value || null;
    ['grams', 'kcal', 'protein', 'fat', 'carbs'].forEach((k) => { m[k] = num($('#m_' + k).value); });
    m.notes = $('#m_notes').value.trim();
    if (stable([m.grams, m.kcal, m.protein, m.fat, m.carbs, m.title]) !== before) m.source = 'manual';
    save(); closeModal();
  },
  deleteMeal(el) {
    const idx = S.meals.findIndex((x) => x.id === el.dataset.id);
    if (idx < 0) return;
    const [m] = S.meals.splice(idx, 1);
    save(); closeModal();
    toast('Удалено', () => { S.meals.push(m); save(); render(); });
  },

  async export() {
    let dl = null;
    try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
    if (!dl) { toast('Сохранение файла недоступно в этом окне'); return; }
    try { await dl.save({ filename: 'personal-hub-' + today() + '.json', data: JSON.stringify(exportData(), null, 2) }); }
    catch (e) { toast('Файл не сохранён'); }
  },
  theme() {
    const cur = document.documentElement.dataset.theme;
    const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('hub.theme', document.documentElement.dataset.theme); } catch (e) {}
  },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) { if (e.target === $('#modal')) closeModal(); return; }
  if (el.disabled) return;
  const fn = A[el.dataset.action];
  if (fn) { e.preventDefault(); fn(el, e); }
});

document.addEventListener('submit', (e) => {
  e.preventDefault();
  if (!isReady()) { toast('Данные ещё загружаются'); return; }
  const f = e.target;
  if (f.id === 'captureForm') {
    const input = $('#capture');
    const t = input.value.trim();
    if (!t) return;
    newItem(t); save(); input.value = '';
    renderNav();
    if (UI.view === 'inbox' || UI.view === 'today') render();
    toast('Во Входящих: «' + (t.length > 40 ? t.slice(0, 40) + '…' : t) + '»');
    return;
  }
  if (f.dataset.form === 'addProject') {
    const t = f.title.value.trim(); if (!t) return;
    newProject(t); save(); f.title.value = ''; render(); toast('Проект создан. Добавь ему первое действие');
    return;
  }
  if (f.dataset.form === 'addStep') {
    const t = f.title.value.trim(); if (!t) return;
    newItem(t, { status: 'next', projectId: f.dataset.id, context: f.context.value || null }); save(); f.title.value = ''; render();
    toast('Добавлено в Следующие действия');
    return;
  }
  if (f.dataset.form === 'addSleep') {
    const start = f.start.value, end = f.end.value;
    if (!start || !end || new Date(end) <= new Date(start)) { toast('Проверь время: «встал» должно быть позже «лёг»'); return; }
    S.sleep.push({ id: uid(), type: f.type.value, start, end, day: end.slice(0, 10), quality: f.quality.value ? Number(f.quality.value) : null, notes: '', createdAt: Date.now() });
    save(); f.reset(); render(); toast('Сон записан: ' + fmtHours(sleepHours({ start, end })));
    return;
  }
  if (f.dataset.form === 'addMeal') {
    const title = f.title.value.trim(); if (!title) return;
    const now = new Date();
    S.meals.push({ id: uid(), title, date: UI.foodDate || today(), time: f.time.value || (UI.foodDate && UI.foodDate !== today() ? null : pad(now.getHours()) + ':' + pad(now.getMinutes())), meal: f.meal.value, grams: num(f.grams.value), kcal: num(f.kcal.value), protein: num(f.protein.value), fat: num(f.fat.value), carbs: num(f.carbs.value), source: 'manual', notes: '', createdAt: Date.now() });
    save(); f.reset(); render(); toast('Добавлено: ' + title);
  }
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'dayWell') { setDay(today(), { wellbeing: e.target.value.trim() }); toast('Самочувствие сохранено'); return; }
  if (e.target.id !== 'importFile') return;
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  file.text().then((txt) => {
    let data;
    try { data = JSON.parse(txt); } catch (err) { toast('Не получилось прочитать файл'); return; }
    const its = Array.isArray(data.items) ? data.items : [], prs = Array.isArray(data.projects) ? data.projects : [];
    const fresh = its.filter((i) => i && i.id && !getItem(i.id)), freshP = prs.filter((p) => p && p.id && !project(p.id));
    if (!fresh.length && !freshP.length) { toast('Новых задач и проектов в файле нет'); return; }
    PENDING_IMPORT = { items: fresh, projects: freshP, contexts: data.contexts };
    askConfirm(`Добавить из файла ${fresh.length} ${plural(fresh.length, 'задачу', 'задачи', 'задач')} и ${freshP.length} ${plural(freshP.length, 'проект', 'проекта', 'проектов')}? Существующее не изменится.`, 'Добавить', () => {
      const d = PENDING_IMPORT; PENDING_IMPORT = null; if (!d) return;
      d.projects.forEach((p) => S.projects.push(Object.assign({ outcome: '', status: 'active', createdAt: Date.now() }, p)));
      d.items.forEach((i) => S.items.push(Object.assign({ notes: '', status: 'inbox', createdAt: Date.now() }, i)));
      if (Array.isArray(d.contexts)) d.contexts.forEach((c) => { if (typeof c === 'string' && !S.contexts.includes(c)) S.contexts.push(c); });
      save(); toast('Импортировано');
    });
  });
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && modalKind) { closeModal(); return; }
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || tag === 'select';
  if (!typing && !modalKind && !e.metaKey && !e.ctrlKey && (e.key === 'n' || e.key === 'т' || e.key === '/')) {
    e.preventDefault(); $('#capture').focus();
  }
  if (e.key === 'Enter' && modalKind === 'process' && tag === 'input') {
    e.preventDefault();
    const primary = $('#sheet .btn.primary');
    if (primary) primary.click();
  }
});

try { const th = localStorage.getItem('hub.theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
connect();
</script>
