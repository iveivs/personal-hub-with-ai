<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="claude:viewport-fit-sides" content="cover" />
    <title>Personal Hub</title>
  </head>
  <body>
    <div class="app">
      <aside class="side">
        <div class="brand">🧠 Personal Hub <small>личная система</small></div>
        <nav class="nav" id="nav" aria-label="Разделы"></nav>
      </aside>
      <main class="main">
        <form class="capture" id="captureForm" autocomplete="off">
          <input
            id="capture"
            placeholder="Что у тебя в голове? Запиши и нажми Enter…"
            aria-label="Быстрый ввод во Входящие"
          />
          <button class="btn primary" type="submit">Во Входящие</button>
        </form>
        <div class="capture-hint">
          Не думай, куда положить, просто запиши. Разберёшь потом.<span class="desk-only">
            Клавиша <span class="kbd">N</span> ставит курсор сюда.</span
          >
        </div>
        <div id="urgentBar" class="urgent-bar" hidden></div>
        <div id="view"><div class="loading">Загружаю данные…</div></div>
      </main>
    </div>
    <div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
    <div class="toast" id="toast" role="status" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
